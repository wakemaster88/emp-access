<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
<title>Offline – EMP Access</title>
<!--
  Offline-Seite des Service Workers (public/sw.js). Bewusst eigenstaendig:
  Stil inline, kein Skript, keine weiteren Dateien – ohne Netz laedt sie
  nichts nach. Aussehen wie src/app/(main)/offline/page.tsx.
-->
<style>
  :root {
    --background: #f9f9fb;
    --foreground: #1f2024;
    --card: #ffffff;
    --border: rgba(31, 32, 36, 0.09);
    --muted-foreground: #696c75;
    --primary: #4f39f6;
    --primary-tint: rgba(79, 57, 246, 0.1);
    --primary-foreground: #fcfcfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #141518;
      --foreground: #f2f3f5;
      --card: #1c1d21;
      --border: rgba(255, 255, 255, 0.08);
      --muted-foreground: #a7a9b0;
      --primary: #5b4bf0;
      --primary-tint: rgba(124, 112, 255, 0.16);
      --primary-foreground: #fcfcfc;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--background);
    color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    width: 100%;
    max-width: 24rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 40px 24px;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .chip {
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: var(--primary-tint);
    color: var(--primary);
  }
  h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
  p { margin: 0; font-size: 0.875rem; line-height: 1.45; color: var(--muted-foreground); }
  a.retry {
    margin-top: 8px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 20px;
    border-radius: 8px;
    background: var(--primary);
    color: var(--primary-foreground);
    font-size: 0.9375rem;
    font-weight: 500;
    text-decoration: none;
  }
  a.retry:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="chip" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></svg>
  </div>
  <h1>Keine Verbindung</h1>
  <p>EMP Access braucht eine Internetverbindung. Sobald WLAN oder Mobilfunk wieder da sind, geht es hier weiter.</p>
  <!-- Leerer Verweis = dieselbe Adresse noch einmal laden (die Seite, die eigentlich gewuenscht war). -->
  <a class="retry" href="">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
    Erneut versuchen
  </a>
</main>
</body>
</html>
